plugins {
    id 'java'
    id 'application'
}

group = 'com.cristomedia'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
    implementation 'org.postgresql:postgresql:42.7.2'
}

application {
    // El servidor Swing es el punto de entrada principal.
    mainClass = 'server.Servidor'
}

// Tarea adicional para arrancar el cliente Swing desde la línea de comandos.
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Ejecuta el cliente Swing de CristoMedia'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'client.ClienteApp'
}

test {
    useJUnitPlatform()
}
